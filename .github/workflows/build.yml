name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "prototype/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Show toolchain
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rtx-hdr-switch
          cache-on-failure: true

      - name: Format
        shell: pwsh
        run: |
          cargo fmt --all -- --check

      - name: Clippy
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        shell: pwsh
        run: cargo test --locked --workspace

      - name: Host release build
        shell: pwsh
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p rtx-hdr-switch --bin RtxHdrSwitch

      - name: GPUI console release build
        shell: pwsh
        run: cargo build --locked --profile ui-release --target x86_64-pc-windows-msvc -p rtx-hdr-settings --bin RtxHdrSettings

      - name: Package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $hostExe = "target/x86_64-pc-windows-msvc/release/RtxHdrSwitch.exe"
          $consoleExe = "target/x86_64-pc-windows-msvc/ui-release/RtxHdrSettings.exe"
          if (-not (Test-Path $hostExe)) { throw "missing $hostExe" }
          if (-not (Test-Path $consoleExe)) { throw "missing $consoleExe" }
          Copy-Item $hostExe $dist
          Copy-Item $consoleExe $dist
          Copy-Item README.md $dist
          Copy-Item THIRD_PARTY_NOTICES.md $dist
          $hostHash = (Get-FileHash $hostExe -Algorithm SHA256).Hash
          $consoleHash = (Get-FileHash $consoleExe -Algorithm SHA256).Hash
          "$hostHash  RtxHdrSwitch.exe" | Set-Content "$dist/RtxHdrSwitch.exe.sha256" -Encoding ascii
          "$consoleHash  RtxHdrSettings.exe" | Set-Content "$dist/RtxHdrSettings.exe.sha256" -Encoding ascii
          $hostSize = (Get-Item $hostExe).Length
          $consoleSize = (Get-Item $consoleExe).Length
          "host_bytes=$hostSize`nconsole_bytes=$consoleSize" | Set-Content "$dist/build-sizes.txt" -Encoding ascii
          Compress-Archive -Path "$dist/*" -DestinationPath "RtxHdrSwitch-win-x64.zip" -Force

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RtxHdrSwitch-win-x64
          path: RtxHdrSwitch-win-x64.zip
          if-no-files-found: error

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: |
            Cargo.lock
            Cargo.toml
            build.rs
            rust-toolchain.toml
            .cargo
            src
            crates
            assets
            resources.rc
          if-no-files-found: warn
