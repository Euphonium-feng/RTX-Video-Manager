[package]
name = "rtx-hdr-switch"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A lightweight global shortcut for NVIDIA RTX Video HDR"
build = "build.rs"

[lib]
name = "rtx_hdr_switch"
path = "src/lib.rs"

[[bin]]
name = "RtxHdrSwitch"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
