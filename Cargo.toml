[package]
name = "rtx-video-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A lightweight global control for NVIDIA RTX Video HDR and VSR"
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
name = "rtx_video_manager"
path = "src/lib.rs"

[[bin]]
name = "RtxVideoManager"
path = "src/main.rs"

[workspace]
members = ["crates/ui"]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.ui-release]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
